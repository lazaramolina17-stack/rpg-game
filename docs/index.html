<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RPG Engine - Play</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a}
#game-canvas{display:block;width:100%;height:100%}
#ui-overlay{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none}
.loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#a855f7;font:18px monospace;z-index:10}
.loading span{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}
</style>
</head>
<body>
<div class="loading"><span>Loading game...</span></div>
<canvas id="game-canvas"></canvas>
<div id="ui-overlay"></div>
<script src="bundle.js"></script>
</body>
</html>
