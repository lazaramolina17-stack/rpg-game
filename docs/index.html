<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RPG Engine 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#game-container{display:block;width:100%;height:100%}
#game-container canvas{display:block}
#ui-overlay{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none}
.loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#a855f7;font:18px monospace;z-index:10}
.loading span{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<div class="loading"><span>Cargando juego 3D...</span></div>
<div id="game-container">
  <canvas id="game-canvas" style="position:absolute;top:0;left:0;width:100%;height:100%"></canvas>
</div>
<div id="ui-overlay"></div>
<script type="module" src="bundle.js"></script>
</body>
</html>
